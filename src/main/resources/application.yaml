server:
  port: ${PORT-NUMBER}
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KS-PASSWORD}
    key-store-type: PKCS12
    key-alias: authservice
    
spring:
  application:
    name: authService

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: true

app:
    jwt:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION}

logging:
  level:
    org.springframework.security: INFO
